server:
  port: ${PORT:8080}

spring:
  application:
    name: celoura-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Nethu2002}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

celoura:
  business:
    name: "Celoura Fashion"
    tagline: "Your Dream Outfit, Designed Your Way."
    address: "No. 129, Yakabedda, Matara road, Akuressa, Sri Lanka"
    phone: "0771699754"
    email: "nethunanayakkara315@gmail.com"
    whatsapp: "94771699754"

  payhere:
    merchant-id: ${PAYHERE_MERCHANT_ID:1220000}
    merchant-secret: ${PAYHERE_MERCHANT_SECRET:sandbox_secret_placeholder}
    mode: ${PAYHERE_MODE:sandbox}
    notify-url: ${PAYHERE_NOTIFY_URL:http://localhost:8080/api/payments/payhere/notify}
    return-url: ${PAYHERE_RETURN_URL:http://localhost:3000/order/payment-success}
    cancel-url: ${PAYHERE_CANCEL_URL:http://localhost:3000/order/payment-cancelled}

logging:
  level:
    com.celoura: DEBUG
    org.springframework.security: INFO
